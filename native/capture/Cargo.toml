[package]
name = "tickmark-capture"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_LibraryLoader",
  "Win32_System_DataExchange", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }
